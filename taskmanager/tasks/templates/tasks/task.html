{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Tasks</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      background: url("{% static 'tasks/images/a63435c88be2e84bc150a36ec87f1271.jpg' %}") center/cover no-repeat;
    }

    .card {
      background-color: #bdbdc8;
      width: 100%;
      max-width: 620px;
      padding: 34px 40px 44px;
      /* border: 1px solid #d8c9c0; */
      /* box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12); */
    }

    #header h1 a {
      display: block;
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: 4px;
      font-size: 2rem;
      color: #4a4038;
      text-decoration: none;
      text-transform: uppercase;
      margin-bottom: 8px;
      transition: color 0.2s ease;
    }

    #header h1 a:hover {
      color: #a8433a;
    }

    hr.divider {
      border: none;
      border-top: 1px solid #d8c9c0;
      margin: 18px 0 26px;
    }

    h2 {
      font-family: 'Cormorant Garamond', serif;
      text-align: center;
      font-size: 1.15rem;
      color: #7a6d62;
      margin-bottom: 16px;
      font-weight: 500;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 28px;
    }

    form label {
      font-size: 0.8rem;
      color: #7a6d62;
      display: block;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    form input, form select {
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      padding: 5px 8px;
      border: none;
      border-bottom: 1px solid #b8a99c;
      background: transparent;
      outline: none;
      color: #4a4038;
    }

    form input:focus, form select:focus {
      border-bottom-color: #a8433a;
    }

    form button {
      font-family: 'Jost', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      padding: 7px 20px;
      background-color: #4a4038;
      color: #f7f1ec;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    form button:hover {
      background-color: #a8433a;
    }

    .error-message {
      color: #a8433a;
      background-color: #f2e3df;
      border: 1px dashed #a8433a;
      padding: 12px;
      text-align: center;
      font-size: 1rem;
    }

    .task-list {
      list-style: none;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px dotted #b8a99c;
    }

    
    .status-check {
      flex-shrink: 0;
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 1.5px solid #4a4038;
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }

    .status-check.checked {
      background-color: #4a4038;
    }

    .status-check.checked::after {
      content: "✓";
      position: absolute;
      top: -4px;
      left: 2px;
      color: #f7f1ec;
      font-size: 13px;
      font-weight: bold;
    }

    .task-title {
      flex: 1;
      color: #4a4038;
      text-decoration: none;
      font-size: 1.05rem;
      transition: color 0.2s ease;
    }

    .task-title:hover {
      color: #a8433a;
      text-decoration: underline;
    }


    .task-row.high-priority .task-title {
      color: #a8433a;
    }

    .task-row.high-priority .status-check {
      border-color: #a8433a;
    }

    .task-row.high-priority .status-check.checked {
      background-color: #a8433a;
    }

    .task-actions a {
      font-size: 0.8rem;
      color: #977f6b;
      text-decoration: none;
      margin-left: 10px;
    }

    .task-actions a:hover {
      color: #cf1c0c;
      text-decoration: underline;
    }

    .main-ops {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 32px;
    }

    .main-ops a {
      text-decoration: none;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      padding: 9px 24px;
      color: #fff;
  
    }
    .main-ops a.add {
      background-color: #4caf50;
    }
    .main-ops a.add:hover {
      background-color: #44b74a;
    }


    .main-ops a.return {
      background-color: #e07b39;
    }
  </style>
</head>
<body>
  
  <form action="{% url 'log_out' %}" method="POST">
    {% csrf_token %}
    <button type="submit">log out</button>
  </form>

  <div class="card">
    <div id="header">
      <h1><a href="{%url 'home'%}">Task Manager</a></h1>
    </div>
    <hr class="divider">

    <h2>Search Tasks</h2>

    <form action="{% url 'search' %}" method="get">
      <div>
        <label for="title">Title</label>
        <input type="text" name="title" id="title" value="{{ request.GET.title }}">
      </div>

      <div>
        <label for="category">Category</label>
        <select name="category" id="category">
          <option value="">All</option>
          {% for category in categories %}
            <option value="{{ category.id }}" {% if category.id|stringformat:"s" == request.GET.category %}selected{% endif %}>{{ category.category_name }}</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit">Search</button>
    </form>

    {% if tasks|length == 0 %}
      <div class="error-message">
        <p>No available tasks :/</p>
      </div>
    {% else %}
      <ul class="task-list">
        {% for task in tasks %}
          <li class="task-row {% if task.priority == 'high' %}high-priority{% endif %}">
            <a href="{% url 'check_task' task.id %}" aria-label="Mark task done">
              <span class="status-check {% if task.completion_status %}checked{% endif %}"></span>
            </a>
            <a class="task-title" href="{% url 'view_task' task.id %}">{{ task.title }}</a>
             <span class="task-actions">
              <a href="{% url 'delete_task' task.id %}">delete</a>
            </span>

          </li>
        {% endfor %}
      </ul>
    {% endif %}

    <div class="main-ops">
      <a href="{% url 'home' %}" class="return">Return</a>
      <a href="{% url 'add_task' %}" class="add">Add</a>
    </div>
  </div>
    <script>
    window.addEventListener('pageshow', function(event){
      if(event.persisted){
        window.location.reload();
      }
    });
  </script>

</body>
</html>
