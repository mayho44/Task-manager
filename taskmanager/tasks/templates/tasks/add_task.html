{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Jost', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
       background: url("{% static 'tasks/images/a63435c88be2e84bc150a36ec87f1271.jpg' %}") center/cover no-repeat;
    }

    .card {
      background-color: #f7f1ec;
      width: 100%;
      max-width: 560px;
      padding: 34px 40px 40px;
      border: 1px solid #d8c9c0;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    }

    h1 {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      letter-spacing: 4px;
      font-size: 2rem;
      color: #4a4038;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    hr.divider {
      border: none;
      border-top: 1px solid #d8c9c0;
      margin: 18px 0 28px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      color: #7a6d62;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .field input[type="text"],
    .field input[type="date"],
    .field textarea,
    .field select {
      width: 100%;
      font-family: 'Jost', sans-serif;
      font-size: 1rem;
      padding: 8px 2px;
      border: none;
      border-bottom: 1px dotted #b8a99c;
      background: transparent;
      outline: none;
      color: #4a4038;
    }

    .field textarea {
      resize: vertical;
      min-height: 60px;
      border: 1px dotted #b8a99c;
      padding: 8px;
    }

    .field-label {
      display: block;
      font-size: 0.8rem;
      color: #595e3b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .tags-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 6px;
    }

    .tag-checkbox {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .tag-pill {
      display: inline-block;
      background-color: transparent;
      color: #595e3b;
      font-size: 0.85rem;
      padding: 5px 16px;
      border: 1px solid #b8a99c;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      user-select: none;
    }

    .tag-checkbox:checked + .tag-pill {
      background-color: #06891c;
      color: #f7f1ec;
      border-color: #06891c;
    }

    .tag-checkbox:focus-visible + .tag-pill {
      outline: 2px solid #a8433a;
      outline-offset: 2px;
    }

    .no-tags {
      font-size: 0.85rem;
      color: #b8a99c;
      font-style: italic;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #a8433a;
    }

    .checkbox-field {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .checkbox-field label {
      font-size: 0.85rem;
      color: #7a6d62;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .checkbox-field input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4a4038;
      cursor: pointer;
    }

    .error-text {
      color: #a8433a;
      font-size: 0.8rem;
      margin-top: 4px;
      display: none;
    }

    .field.invalid input,
    .field.invalid textarea,
    .field.invalid select {
      border-color: #a8433a;
    }

    .field.invalid .error-text {
      display: block;
    }

    .actions {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-top: 30px;
    }

    .actions button,
    .actions a {
      text-decoration: none;
      font-family: 'Jost', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      padding: 9px 26px;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease;
      text-align: center;
    }


    .actions button.add {
      background-color: #4caf50;
    }
    .actions button.add:hover {
      background-color: #15a61a;
    }

    .actions a.return {
      background-color: #e07b39;
    }
    .actions a.return:hover {
      background-color: #e96914;
    }



.new-tag-input.visible {
  display: inline-block;
}

.new-tag-input:focus {
  border-color: #a8433a;
}
  </style>
</head>
<body>

  
  <div class="card">
    <h1>Add Task</h1>
    <hr class="divider">

    <form action="{% url 'add_task' %}" method="post" id="add-task-form" novalidate>
      {% csrf_token %}

      <div class="field" id="field-title">
        <label for="title">Title</label>
        <input type="text" name="title" id="title" maxlength="100" required>
        <span class="error-text">Please enter a title.</span>
      </div>

      <div class="field">
        <label for="description">Description</label>
        <textarea name="description" id="description"></textarea>
      </div>

      <div class="checkbox-field">
        <input type="checkbox" name="completion_status" id="completion_status">
        <label for="completion_status">Already completed</label>
      </div>

      <div class="field" id="field-date">
        <label for="date">Due date</label>
        <input type="date" name="due_date" id="date">
        <span class="error-text">Due date can't be in the past.</span>
      </div>

      <div class="field" id="field-priority">
        <label for="priority">Priority</label>
        <select name="priority" id="priority" required>
          <option value="" selected disabled>Select priority</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
        <span class="error-text">Please choose a priority.</span>
      </div>

      <div class="field">
        <span class="field-label">Tags</span>
        <div class="tags-wrap">
          {% for tag in tags %}
            <input type="checkbox" name="tags" value="{{ tag.id }}" id="tag-{{ tag.id }}" class="tag-checkbox">
            <label for="tag-{{ tag.id }}" class="tag-pill">{{ tag.tag_name }}</label>
          {% empty %}
            <span class="no-tags">No tags available</span>
          {% endfor %}
          <!--  <label class="tag-pill" id="add-tag-btn">+</label>
          <div id="tag-input" class="tags-wrap"> -->
          <!-- </div> --> 
          



        </div>
      </div>

      <div class="field" id="field-category">
        <label for="category">Category</label>
        <select name="category" id="category" required>
          <option value="" selected disabled>Select category</option>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.category_name }}</option>
          {% endfor %}
        </select>
        <span class="error-text">Please choose a category.</span>
      </div>

      <div class="actions">
        <a href="{% url 'all_tasks' %}" class="return">Return</a>
        <button type="submit" class="add">Add</button>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('add-task-form');

    function setError(fieldId, isInvalid) {
      document.getElementById(fieldId).classList.toggle('invalid', isInvalid);
    }

    function validateTitle() {
      const title = document.getElementById('title').value.trim();
      const invalid = title.length === 0;
      setError('field-title', invalid);
      return !invalid;
    }

    function validateDate() {
      const dateValue = document.getElementById('date').value;
      if (!dateValue) {
        setError('field-date', false); 
        return true;
      }
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const chosen = new Date(dateValue);
      const invalid = chosen < today;
      setError('field-date', invalid);
      return !invalid;
    }

    function validatePriority() {
      const value = document.getElementById('priority').value;
      const invalid = value === '';
      setError('field-priority', invalid);
      return !invalid;
    }

    function validateCategory() {
      const value = document.getElementById('category').value;
      const invalid = value === '';
      setError('field-category', invalid);
      return !invalid;
    }

    document.getElementById('title').addEventListener('input', validateTitle);
    document.getElementById('date').addEventListener('change', validateDate);
    document.getElementById('priority').addEventListener('change', validatePriority);
    document.getElementById('category').addEventListener('change', validateCategory);
    

//     const tagInput=document.getElementById('tag-input')
//     const addTagBtn = document.getElementById('add-tag-btn');

// addTagBtn.addEventListener('click', function () {
  
//   const input = document.createElement('input');
//   input.type = 'text';
//   input.name = 'new_tag';
//   input.placeholder = 'add tag';
//   input.className = 'tag-pill';
//   tagInput.appendChild(input)

// });



    form.addEventListener('submit', function (e) {
      const validTitle = validateTitle();
      const validDate = validateDate();
      const validPriority = validatePriority();
      const validCategory = validateCategory();

      if (!validTitle || !validDate || !validPriority || !validCategory) {
        e.preventDefault();
      }
    });


    window.addEventListener('pageshow', function(event){
      if(event.persisted){
        window.location.reload();
      }
    });

  </script>

</body>
</html>
